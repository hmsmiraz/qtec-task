# ─────────────────────────────────────────────────────────────
# Server Block: qtec-task API
# Handles: Reverse Proxy, Security Headers, Rate Limiting
# ─────────────────────────────────────────────────────────────

server {
    listen       80;
    server_name  localhost;

    # ── Security Headers ──────────────────────────────────────
    # Prevent clickjacking
    add_header X-Frame-Options         "SAMEORIGIN"            always;
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options  "nosniff"               always;
    # XSS protection
    add_header X-XSS-Protection        "1; mode=block"         always;
    # Referrer policy
    add_header Referrer-Policy         "no-referrer-when-downgrade" always;
    # Content security policy
    add_header Content-Security-Policy "default-src 'self'"    always;

    # ── Root / API Routes ─────────────────────────────────────
    location / {
        # Apply rate limiting
        # burst=200: allow up to 200 queued requests
        # nodelay: don't delay burst requests
        limit_req zone=api_limit burst=200 nodelay;

        # Pass requests to upstream API backend
        proxy_pass http://qtec_api_backend;

        # ── Proxy Headers ─────────────────────────────────────
        # Pass real client IP to Node.js app
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;

        # ── Proxy Timeouts ────────────────────────────────────
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # ── Proxy Buffering ───────────────────────────────────
        proxy_buffering    on;
        proxy_buffer_size  4k;
        proxy_buffers      8 4k;

        # ── HTTP Version ──────────────────────────────────────
        # Use HTTP/1.1 for upstream (required for keepalive)
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }

    # ── Health Check Endpoint ─────────────────────────────────
    # Used by:
    # - Docker healthcheck
    # - Kubernetes liveness probe
    # - Monitoring systems
    # Does NOT go to upstream — Nginx handles it directly
    location /nginx-health {
        access_log off;          # Don't log health checks
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"nginx","timestamp":"$time_iso8601"}';
    }

    # ── Metrics Passthrough ───────────────────────────────────
    # Allow Prometheus to scrape metrics from API
    location /metrics {
        # Only allow internal access (Prometheus pod)
        # In production: restrict to Prometheus IP
        allow all;
        proxy_pass http://qtec_api_backend;
        proxy_set_header Host $host;
    }

    # ── Status Endpoints ──────────────────────────────────────
    location /status {
        # No rate limiting on health checks
        proxy_pass http://qtec_api_backend;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }

    # ── Block Hidden Files ────────────────────────────────────
    # Prevent access to .env, .git etc
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Custom Error Pages ────────────────────────────────────
    error_page 404 /404.json;
    location = /404.json {
        add_header Content-Type application/json;
        return 404 '{"status":"error","message":"Not found","code":404}';
    }

    error_page 500 502 503 504 /50x.json;
    location = /50x.json {
        add_header Content-Type application/json;
        return 500 '{"status":"error","message":"Server error","code":500}';
    }
}