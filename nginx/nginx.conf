# ─────────────────────────────────────────────────────────────
# Main Nginx Configuration
# Role: Reverse Proxy + Load Balancer
# ─────────────────────────────────────────────────────────────

# Run as nginx user (non-root inside container)
user  nginx;

# Auto-detect number of CPU cores
# In K8s this matches the pod's CPU allocation
worker_processes  auto;

# Error log location and level
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

# ─── Events Block ─────────────────────────────────────────────
events {
    # Max simultaneous connections per worker
    # worker_processes(auto) x worker_connections = total connections
    # e.g: 2 workers x 1024 = 2048 total connections
    worker_connections  1024;

    # Accept multiple connections at once (performance)
    multi_accept on;

    # Efficient connection processing method
    use epoll;
}

# ─── HTTP Block ───────────────────────────────────────────────
http {
    # ── Basic Settings ────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging Format ────────────────────────────────────────
    # Custom log format with all useful fields
    # These logs will be scraped by Prometheus in Step 5
    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time '
                      'urt=$upstream_response_time '
                      'uaddr=$upstream_addr '
                      'reqid=$http_x_request_id';

    access_log  /var/log/nginx/access.log  main;

    # ── Performance Settings ──────────────────────────────────
    # Efficient file transfers
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    # Keep-alive timeout (how long to keep idle connections)
    keepalive_timeout  65;
    keepalive_requests 100;

    # ── Gzip Compression ──────────────────────────────────────
    # Reduces response size → faster transfer → handles more req/sec
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml;

    # ── Security: Hide Nginx version ──────────────────────────
    server_tokens off;

    # ── Buffer Settings ───────────────────────────────────────
    # Prevent buffer overflow attacks
    client_body_buffer_size     16k;
    client_header_buffer_size   1k;
    client_max_body_size        10m;
    large_client_header_buffers 4 8k;

    # ── Timeout Settings ──────────────────────────────────────
    client_body_timeout   12s;
    client_header_timeout 12s;
    send_timeout          10s;

    # ── Rate Limiting ─────────────────────────────────────────
    # Protect against abuse and DDoS
    # Zone: 10MB memory stores ~160,000 IP addresses
    # Rate: 100 requests/second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

    # ── Upstream: Load Balancer ───────────────────────────────
    # Round-robin by default across API instances
    # In K8s: this points to the K8s Service (Step 8)
    upstream qtec_api_backend {
        # Load balancing method: round-robin (default)
        # Requests distributed evenly across all servers

        # API instances
        # In docker-compose: multiple containers
        # In K8s: this will be the K8s service DNS
        server api1:3000 weight=1 max_fails=3 fail_timeout=30s;
        server api2:3000 weight=1 max_fails=3 fail_timeout=30s;
        server api3:3000 weight=1 max_fails=3 fail_timeout=30s;

        # Keep connections alive to upstream servers
        # Reduces connection overhead → handles ~100 req/sec easily
        keepalive 32;
    }

    # ── Include Server Blocks ─────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}