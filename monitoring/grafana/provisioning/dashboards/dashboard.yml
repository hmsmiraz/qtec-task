# ─────────────────────────────────────────────────────────────
# Grafana Dashboard Provisioning
# Auto-loads dashboards from /var/lib/grafana/dashboards
# ─────────────────────────────────────────────────────────────

apiVersion: 1

providers:
  - name: 'qtec-task'
    orgId: 1
    folder: 'qtec-task'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards