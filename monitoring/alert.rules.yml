# ─────────────────────────────────────────────────────────────
# Alert Rules - qtec-task
# ─────────────────────────────────────────────────────────────

groups:
  - name: qtec-task-alerts
    rules:

      # ── API Instance Down ────────────────────────────────
      - alert: APIInstanceDown
        expr: up{app="qtec-task"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "API instance {{ $labels.instance }} is down"
          description: "API instance has been down for 30 seconds"

      # ── High Error Rate ──────────────────────────────────
      - alert: HighErrorRate
        expr: |
          rate(http_errors_total[5m]) > 0.1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors/sec"

      # ── High Response Time ───────────────────────────────
      - alert: HighResponseTime
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket[5m])
          ) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }}s"

      # ── High Memory Usage ────────────────────────────────
      - alert: HighMemoryUsage
        expr: |
          process_resident_memory_bytes / 1024 / 1024 > 200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value }}MB"

      # ── Too Many Active Requests ─────────────────────────
      - alert: TooManyActiveRequests
        expr: http_active_requests > 50
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Too many active requests"
          description: "Active requests: {{ $value }}"