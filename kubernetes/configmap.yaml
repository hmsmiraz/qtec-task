# ─────────────────────────────────────────────────────────────
# ConfigMap: Non-sensitive app configuration
# Sensitive values come from Vault (not here)
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: qtec-task-config
  namespace: qtec-task
  labels:
    app: qtec-task
data:
  NODE_ENV:      "production"
  PORT:          "3000"
  APP_NAME:      "qtec-task"
  APP_VERSION:   "1.0.0"
  LOG_LEVEL:     "info"
  VAULT_ADDR:    "http://qtec-vault:8200"
  VAULT_ENABLED: "true"