# ─────────────────────────────────────────────────────────────
# HashiCorp Vault Deployment in Kubernetes
# ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qtec-vault
  namespace: qtec-task
  labels:
    app: qtec-task
    component: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qtec-task
      component: vault
  template:
    metadata:
      labels:
        app: qtec-task
        component: vault
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:latest
          ports:
            - containerPort: 8200
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              value: "qtec-root-token"
            - name: VAULT_DEV_LISTEN_ADDRESS
              value: "0.0.0.0:8200"
            - name: VAULT_ADDR
              value: "http://0.0.0.0:8200"
          args: ["vault", "server", "-dev"]
          resources:
            requests:
              cpu:    "100m"
              memory: "128Mi"
            limits:
              cpu:    "200m"
              memory: "256Mi"
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: qtec-vault
  namespace: qtec-task
  labels:
    app: qtec-task
    component: vault
spec:
  selector:
    app: qtec-task
    component: vault
  type: ClusterIP
  ports:
    - name: vault
      port: 8200
      targetPort: 8200