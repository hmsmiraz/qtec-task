# ─────────────────────────────────────────────────────────────
# Nginx ConfigMap: Reverse Proxy + Load Balancer config
# Routes traffic to qtec-task-api-svc
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: qtec-task
data:
  nginx.conf: |
    events {
      worker_connections 1024;
      multi_accept on;
    }

    http {
      # Hide nginx version
      server_tokens off;

      # Logging
      log_format main '$remote_addr - [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      'rt=$request_time uaddr=$upstream_addr';

      access_log /var/log/nginx/access.log main;
      error_log  /var/log/nginx/error.log warn;

      # Gzip
      gzip on;
      gzip_types application/json text/plain;

      # Rate limiting
      limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

      # ── Upstream: K8s Service ────────────────────────────
      # K8s Service handles load balancing to pods
      # No need to list individual pods
      upstream qtec_api_backend {
        server qtec-task-api-svc:80;
        keepalive 32;
      }

      server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header X-XSS-Protection       "1; mode=block" always;

        # Main API routes
        location / {
          limit_req zone=api_limit burst=200 nodelay;

          proxy_pass         http://qtec_api_backend;
          proxy_set_header   Host              $host;
          proxy_set_header   X-Real-IP         $remote_addr;
          proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_http_version 1.1;
          proxy_set_header   Connection        "";

          proxy_connect_timeout 10s;
          proxy_read_timeout    30s;
        }

        # Nginx health check
        location /nginx-health {
          access_log off;
          add_header Content-Type application/json;
          return 200 '{"status":"ok","service":"nginx"}';
        }

        # Block hidden files
        location ~ /\. {
          deny all;
        }
      }
    }