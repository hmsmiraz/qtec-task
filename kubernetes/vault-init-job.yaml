# ─────────────────────────────────────────────────────────────
# Vault Init Job
# Runs once to seed secrets into Vault
# ─────────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-init
  namespace: qtec-task
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: vault-init
          image: alpine/curl:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "⏳ Waiting for Vault..."
              until curl -fs http://qtec-vault:8200/v1/sys/health; do
                sleep 3
              done
              echo "✅ Vault ready!"

              # Enable KV engine
              curl -s \
                --header "X-Vault-Token: qtec-root-token" \
                --request POST \
                --data '{"type":"kv","options":{"version":"2"}}' \
                http://qtec-vault:8200/v1/sys/mounts/secret || true

              # Store app secrets
              curl -s \
                --header "X-Vault-Token: qtec-root-token" \
                --request POST \
                --data '{
                  "data": {
                    "APP_NAME": "qtec-task",
                    "APP_VERSION": "1.0.0",
                    "NODE_ENV": "production",
                    "SECRET_KEY": "qtec-super-secret-key-2024",
                    "API_KEY": "qtec-api-key-abc123"
                  }
                }' \
                http://qtec-vault:8200/v1/secret/data/qtec-task/app

              # Store database secrets
              curl -s \
                --header "X-Vault-Token: qtec-root-token" \
                --request POST \
                --data '{
                  "data": {
                    "DB_HOST": "localhost",
                    "DB_PORT": "5432",
                    "DB_NAME": "qtec_db",
                    "DB_USER": "qtec_user",
                    "DB_PASSWORD": "qtec-db-password-2024"
                  }
                }' \
                http://qtec-vault:8200/v1/secret/data/qtec-task/database

              echo "✅ Vault secrets seeded successfully!"