version: '3.8'

# ─── Networks ─────────────────────────────────────────────────
networks:
  qtec-network:
    driver: bridge
    name: qtec-network

# ─── Volumes ──────────────────────────────────────────────────
volumes:
  prometheus-data:
  grafana-data:
  vault-data:

# ─── Services ─────────────────────────────────────────────────
services:

  # ── API Instance 1 ──────────────────────────────────────────
  api1:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: production
    container_name: qtec-api-1
    restart: unless-stopped
    # No external port — only accessible via Nginx
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_NAME=qtec-task
      - APP_VERSION=1.0.0
      - LOG_LEVEL=info
      - INSTANCE_ID=api1
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=qtec-root-token
      - VAULT_ENABLED=true  
    networks:
      - qtec-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1",
             "--spider", "http://localhost:3000/status/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── API Instance 2 ──────────────────────────────────────────
  api2:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: production
    container_name: qtec-api-2
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_NAME=qtec-task
      - APP_VERSION=1.0.0
      - LOG_LEVEL=info
      - INSTANCE_ID=api2
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=qtec-root-token
      - VAULT_ENABLED=true  
    networks:
      - qtec-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1",
             "--spider", "http://localhost:3000/status/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── API Instance 3 ──────────────────────────────────────────
  api3:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: production
    container_name: qtec-api-3
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_NAME=qtec-task
      - APP_VERSION=1.0.0
      - LOG_LEVEL=info
      - INSTANCE_ID=api3
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=qtec-root-token
      - VAULT_ENABLED=true  
    networks:
      - qtec-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1",
             "--spider", "http://localhost:3000/status/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# ── Nginx Reverse Proxy + Load Balancer ─────────────────────
  nginx:
    image: nginx:alpine
    container_name: qtec-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api1
      - api2
      - api3
    networks:
      - qtec-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Prometheus ───────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: qtec-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - qtec-network

# ── Grafana ──────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: qtec-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/qtec-dashboard.json
    volumes:
      - grafana-data:/var/lib/grafana
      # Auto-provision datasource (Prometheus)
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      # Auto-provision dashboard loader
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      # Pre-built dashboards
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - qtec-network

# ── HashiCorp Vault ──────────────────────────────────────────
  vault:
    image: hashicorp/vault:latest
    container_name: qtec-vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: qtec-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://0.0.0.0:8200
    cap_add:
      - IPC_LOCK              # Required by Vault
    command: vault server -dev
    volumes:
      - ./vault/config:/vault/config:ro
      - ./vault/init:/vault/init
      - vault-data:/vault/data
    networks:
      - qtec-network
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://localhost:8200"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Vault Init ───────────────────────────────────────────────
  # Runs once to seed secrets into Vault
  vault-init:
    image: alpine/curl:latest
    container_name: qtec-vault-init
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - ./vault/init:/vault/init
    networks:
      - qtec-network
    command: sh /vault/init/init-vault.sh
    restart: "no"       # Run once only

    
